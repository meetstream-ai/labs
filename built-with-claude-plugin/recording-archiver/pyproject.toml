[project]
name = "recording-archiver"
version = "0.1.0"
description = "Archive MeetStream bot recordings to local disk."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[project.scripts]
recording-archiver = "recording_archiver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recording_archiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
