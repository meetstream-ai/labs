[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetstream-talk-time"
version = "0.1.0"
description = "Per-speaker talk-time stats for a finished MeetStream bot's speaker timeline"
requires-python = ">=3.9"
dependencies = [
    "ijson>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
talk-time = "talk_time.cli:main"

[tool.setuptools.packages.find]
include = ["talk_time*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
