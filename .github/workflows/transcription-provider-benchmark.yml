name: Transcription provider benchmark
on:
  push:
    paths:
      - 'transcription-provider-benchmark/**'
      - '.github/workflows/transcription-provider-benchmark.yml'
  pull_request:
    paths:
      - 'transcription-provider-benchmark/**'
      - '.github/workflows/transcription-provider-benchmark.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: transcription-provider-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: transcription-provider-benchmark/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
