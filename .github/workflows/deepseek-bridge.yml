name: DeepSeek bridge
on:
  push:
    paths:
      - 'meetstream-deepseek-bridge/**'
      - '.github/workflows/deepseek-bridge.yml'
  pull_request:
    paths:
      - 'meetstream-deepseek-bridge/**'
      - '.github/workflows/deepseek-bridge.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: meetstream-deepseek-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: meetstream-deepseek-bridge/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run demo
      - run: npm audit --audit-level=high
