# Optional: use the already downloaded qwen3:4b-instruct-2507-q4_K_M through local Ollama.
# This runs DeepSeek Harness with a Qwen model, not a DeepSeek-hosted model.
- id: llm-pi-ai
  config:
    providers:
      local-ollama:
        displayName: Local Ollama
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        apiKeyEnv: OLLAMA_API_KEY
        models:
          - id: qwen3:4b-instruct-2507-q4_K_M
            name: Qwen3 4B Instruct (local)
            contextWindow: 32768
            maxTokens: 4096
- id: agent-default-model
  config:
    provider: local-ollama
    model: qwen3:4b-instruct-2507-q4_K_M
