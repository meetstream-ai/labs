name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Package checks (manifests, skills, live tool names, secrets, no transport)
        run: python3 scripts/check.py --live --no-hermes
      - name: Demo script syntax
        run: bash -n scripts/demo.sh
